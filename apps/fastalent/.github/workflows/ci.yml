name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel stale runs when a new push lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prisma 7 resolves datasource.url inside prisma.config.ts at CLI load time
    # (even for `generate`, which doesn't actually connect). The runtime env
    # file is gitignored, so we inject a throwaway URL here — no database is
    # ever reached. If you move any step to one that actually hits the DB,
    # wire a real URL via repository secrets instead.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma client is generated at install-time, but running an explicit
      # `prisma generate` guards against cached node_modules layers missing
      # the generated client on first run of a new workspace.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
