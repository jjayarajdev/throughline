# Flyway configuration for the platform database (PostgreSQL 16).
# Run with:  scripts/flyway.sh migrate     (wraps the flyway/flyway:10 Docker image)
flyway.url=jdbc:postgresql://host.docker.internal:5433/platform
flyway.user=postgres
flyway.password=${PGPASSWORD}
flyway.locations=filesystem:/flyway/sql
flyway.schemas=core,throughline,fastalent
flyway.defaultSchema=core
flyway.baselineOnMigrate=false
flyway.validateMigrationNaming=true
